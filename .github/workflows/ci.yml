name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff lint
        run: ruff check .

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prove the package installs and imports
        run: |
          python -m pip install -e '.[dev]'
          cd /tmp && python -c "import charon.charon_loop, charon.memory.memory_engine, charon.infra.config"

      - name: Install Chromium and its system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5

      - name: Prepare and verify the embedding model
        run: |
          python - <<'PY'
          from sentence_transformers import SentenceTransformer
          model = SentenceTransformer('BAAI/bge-base-en-v1.5', device='cpu')
          embedding = model.encode('CI embedding cache check')
          assert embedding.shape == (768,)
          PY

      - name: Run the full Python test suite
        env:
          # In-process embedding backend — no per-test worker subprocess.
          CHARON_EMBED_BACKEND: local
          # The preceding step must populate a usable cache, including on a miss.
          HF_HUB_OFFLINE: '1'
          # Small embedding batches are slower with oversized CPU thread pools.
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: pytest -q tests/

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust TUI
        run: cargo build --release --manifest-path crates/charon-tui/Cargo.toml
